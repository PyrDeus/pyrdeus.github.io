<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Globe Test</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .globe-test {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .globe-frame {
        width: min(420px, 90vw);
        aspect-ratio: 1 / 1;
        border: 3px solid var(--highlight);
        padding: 0.4rem;
      }

      .globe-frame canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <script src="https://unpkg.com/topojson@1"></script>
    <script src="https://unpkg.com/planetary.js@1.1.1/dist/planetaryjs.min.js"></script>
    <script src="scripts/globe.js"></script>
  </head>
  <canvas id="basicGlobe" width="400" height="400"></canvas>
</html>
